name: Build & Test

# Manual only: run it from the Actions tab (Build & Test › Run workflow) when wanted.
# Each run tests the app, then builds an optimised Release copy and publishes it as a
# GitHub Release (Reel-macOS-arm64.zip). To build on every push again, add `push:` under `on:`.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # to publish the release
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/FFmpeg/FFmpeg.xcframework
            Vendor/FFmpeg/FFmpeg.xcconfig
            Vendor/FFmpeg/BUILD_INFO
            Vendor/FFmpeg/LICENSE.LGPLv2.1
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL, static, arm64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      # Saved right away, so a failing app build doesn't force an FFmpeg rebuild next time.
      - name: Save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/FFmpeg/FFmpeg.xcframework
            Vendor/FFmpeg/FFmpeg.xcconfig
            Vendor/FFmpeg/BUILD_INFO
            Vendor/FFmpeg/LICENSE.LGPLv2.1
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build and run unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Reel.xcodeproj -scheme Reel -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            test 2>&1 | tee build/xcodebuild.log \
            | grep -E "error:|warning: .*/Reel|Test Suite .*(passed|failed)|Test Case .*(failed|skipped)|Executed|render paths|hardware decode:|virtualizer|audio mode switching|\*\* (BUILD|TEST)"

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild -project Reel.xcodeproj -scheme Reel -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/Release \
            build 2>&1 | tee build/release.log | grep -E "error:|warning: .*/Reel|\*\* BUILD"
          APP=build/Release/Build/Products/Release/Reel.app
          codesign --verify --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "^(Identifier|Format|Signature)"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/Reel")"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "REEL_VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/Reel-macOS-arm64.zip
          ls -lh build/Reel-macOS-arm64.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cat > build/notes.md <<NOTES
          Reel ${REEL_VERSION}, built from ${GITHUB_SHA::7} on ${{ github.ref_name }}. Apple Silicon, macOS 14 or later.

          **Install:** download \`Reel-macOS-arm64.zip\`, double-click it, and drag **Reel** into **Applications**.

          **First launch:** Reel isn't notarized by Apple, so macOS blocks the first open. Either run
          \`xattr -dr com.apple.quarantine /Applications/Reel.app\` in Terminal, or try to open Reel once,
          then go to System Settings › Privacy & Security and click **Open Anyway**.
          NOTES
          gh release create "$TAG" build/Reel-macOS-arm64.zip --target "$GITHUB_SHA" \
            --title "Reel ${REEL_VERSION} (build ${{ github.run_number }})" --notes-file build/notes.md --latest

      - name: Show build errors
        if: failure()
        run: |
          for log in build/xcodebuild.log build/release.log; do
            [[ -f $log ]] || continue
            grep -n -E -A25 "Undefined symbols|^ld: |error:|Fatal error|failed \(" "$log" | head -300 || true
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/xcodebuild.log
            build/release.log
            build/TestResults.xcresult
            Vendor/FFmpeg/.build/*.log
          if-no-files-found: ignore
